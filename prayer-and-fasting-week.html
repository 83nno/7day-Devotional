<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prayer and Fasting Week · C3 UnitedLife</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Caveat:wght@500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--or:#E67A38;--or-d:#B84E12;--bg:#F3F2EE;--card:#fff;--tx:#2a2622;--mut:#6f675f;--tint:#fbe9dd;--line:#e2ddd5;--fs:18px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1917;--card:#26221f;--tx:#efe9e2;--mut:#a79d93;--tint:#3a2a20;--line:#3a342f;--or-d:#f0a070;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1917;--card:#26221f;--tx:#efe9e2;--mut:#a79d93;--tint:#3a2a20;--line:#3a342f;--or-d:#f0a070;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 var(--fs)/1.7 'Inter',system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--or);z-index:10}
header{background:var(--or);color:#fff;padding:34px 24px 26px}
.wrap{max-width:680px;margin:0 auto}
.lock{width:200px;margin:0 0 24px}
.lock img{display:block;width:100%;height:auto;filter:brightness(0) invert(1)}
.lock .dv{display:flex;justify-content:space-between;margin:9px 0 0 18%;font:600 11px/1 'Inter',sans-serif;color:#fff}
header h1{margin:0;font:400 34px/1.15 'Libre Baskerville',Georgia,serif}
header h1 span{display:block;font:500 46px/1.1 'Caveat',cursive;margin-top:4px;position:relative;width:max-content;max-width:100%}
header h1 span::after{content:"";display:block;height:3px;background:#fff;border-radius:2px;margin-top:2px}
header p{margin:14px 0 0;font-size:14px;opacity:.92}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:8px;padding:10px 16px;overflow-x:auto}
nav button{flex:1 0 auto;min-width:46px;height:46px;border-radius:23px;border:1.5px solid var(--line);background:var(--card);color:var(--tx);font:600 15px 'Inter',sans-serif;cursor:pointer;position:relative}
nav button[aria-current="true"]{background:var(--or);border-color:var(--or);color:#fff}
nav button.done::after{content:"✓";position:absolute;top:-5px;right:-3px;width:18px;height:18px;border-radius:9px;background:#3d8b5a;color:#fff;font-size:11px;line-height:18px}
nav button.today{border-color:var(--or)}
main{padding:28px 20px 12px}
.kick{font:600 13px 'Inter';letter-spacing:.14em;text-transform:uppercase;color:var(--or-d);margin:0 0 8px}
h2{font:700 27px/1.25 'Libre Baskerville',Georgia,serif;margin:0 0 22px}
.verse{background:var(--card);border-left:5px solid var(--or);border-radius:4px 14px 14px 4px;padding:18px 20px;margin:0 0 26px}
.verse b{display:block;font:600 13px 'Inter';letter-spacing:.06em;text-transform:uppercase;color:var(--or-d);margin-bottom:8px}
.verse p{margin:0;font:italic 400 1em/1.7 'Libre Baskerville',Georgia,serif}
.body p,.body li{margin:0 0 1.1em}.body ol{padding-left:1.3em}
.refl,.pray{border-radius:16px;padding:20px;margin:30px 0 0}
.refl{background:var(--tint)}.pray{background:var(--card);border:1px solid var(--line)}
.refl h3,.pray h3{margin:0 0 10px;font:600 13px 'Inter';letter-spacing:.14em;text-transform:uppercase;color:var(--or-d)}
.refl p{margin:0;font-weight:500}.pray p{margin:0 0 1em;font-style:italic}.pray p:last-child{margin:0}
textarea{width:100%;min-height:130px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card);color:var(--tx);font:inherit;font-size:16px;line-height:1.55;resize:vertical}
textarea:focus{outline:2px solid var(--or);border-color:var(--or)}
.row{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--mut);flex:1}
.btn{border:0;border-radius:26px;padding:13px 22px;font:600 15px 'Inter',sans-serif;cursor:pointer;background:var(--or);color:#fff}
.btn.alt{background:transparent;color:var(--or-d);border:1.5px solid var(--or)}
.btn.ok{background:#3d8b5a}
.pn{display:flex;gap:10px;margin:28px 0 0}.pn .btn{flex:1}
.pn .btn:disabled{opacity:.35;cursor:default}
footer{text-align:center;padding:30px 20px 40px;color:var(--mut);font-size:13px}
footer .logo{display:block;width:210px;max-width:70%;height:auto;margin:0 auto 14px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) footer .logo{filter:invert(1)}}
:root[data-theme="dark"] footer .logo{filter:invert(1)}
.tsz{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-bottom:18px}
.tsz span{font-size:13px;color:var(--mut);margin-right:2px}
.tsz button{min-width:46px;height:38px;border-radius:19px;border:1.5px solid var(--or);background:transparent;color:var(--or-d);font-family:'Inter',sans-serif;font-weight:600;cursor:pointer}
.tsz button:active{background:var(--tint)}
</style></head><body>

<script>
const DAYS=[{"n": 1, "title": "God Is Intentional About You", "ref": "Jeremiah 29:11-13 (NKJV)", "verse": "For I know the thoughts that I think toward you, says the Lord, thoughts of peace and not evil, to give you a future and a hope. Then you will call upon Me and go and pray to Me, and I will listen to you. And you will seek Me and find Me, when you search for Me with all your heart.", "body": "<p>This is one of the most popular scriptures quoted and declared by Christians all over the world, and rightly so, because of the reassurance and hope it gives us. However, one word that particularly stands out to me in this passage is <strong>“thoughts”<\/strong> – <em>the thoughts God thinks towards us.<\/em><\/p><p>Think about that for a moment: <strong>God is thinking about you!<\/strong> He is not distant or unaware of who you are. He knows you intimately and is intentional about every detail of your life. Before you ever thought about your future, God already had you in mind. He has thoughts and plans concerning your life, and they are not ordinary plans. They are thoughts of peace, not evil, to give you a future and a hope. How reassuring and encouraging is that!<\/p><p>As human beings, we naturally make plans for our lives and often work hard to see them come to pass. But if the King of kings, the One who knows the end from the beginning, has already thought about us and has plans to give us a future and a hope, <em><strong>wouldn’t you want to know what those plans are? Wouldn’t you want to see them become a reality? Wouldn’t you want to be part of what He has prepared for you?<\/strong><\/em> I certainly do!<\/p><p>No plan we can come up with for ourselves can compare with what God has in mind for us. This is why it is so important that we seek to know His heart, understand His thoughts and align our lives with His will. If God is this intentional about us, shouldn’t we be just as intentional about seeking Him?<\/p><p>This brings us to <strong>verses 12 and 13<\/strong>, where God shows us how to respond. He invites us to call upon Him, pray to Him and seek Him with all our hearts, with the assurance that He will hear us and that we will find Him.<\/p><p>This invitation is particularly important during the difficult seasons of life. When things do not go as we expected, when sickness takes its toll, when grief and pain threaten to overwhelm us, or when we are waiting for that long-awaited breakthrough and the devil seem to intimidate us, we must not withdraw from God. Instead, we are encouraged to draw closer to Him, seek His face and trust Him.<\/p><p>As we seek Him wholeheartedly, He gives us understanding, wisdom and direction. He helps us recognise His hand at work, even in the middle of the storm. Understanding God’s heart and His promises concerning us strengthens our faith, deepens our trust in Him and helps us remain aligned with His will, even when we cannot see the full picture.<\/p><p><strong>The major message is this: God is intentional about you, and you must be intentional about seeking Him.<\/strong> Don’t just desire the promises of God; desire the God of the promises. Don’t just seek what His hands can give you; seek His heart and His thoughts for your life.<\/p><p>So, as we begin this week of prayer and fasting, let us be intentional about seeking Him. Call upon Him today. Pray to Him today. Seek Him with your whole heart, and you will find Him. He is listening, He is present, and He is intentional about you!<\/p>", "refl": "Knowing that God is intentional about you and has thoughts of peace, a future and a hope for your life, what will you do differently this week to seek Him and align yourself with His plans?", "reflText": "Knowing that God is intentional about you and has thoughts of peace, a future and a hope for your life, what will you do differently this week to seek Him and align yourself with His plans?", "prayer": "<p>Dear Heavenly Father, we thank You for Your unfailing love and for being so intentional about our lives. Thank You for Your wonderful thoughts towards us – thoughts of peace and not evil, to give us a future and a hope. Forgive us for the times we have been so occupied with our own plans that we have neglected to seek Your heart and Your will. As we begin this week of prayer and fasting, stir up in us a deeper desire to know You, seek You and walk in alignment with Your plans for our lives. Give us hearts that are intentional about spending time in Your presence, calling upon You and trusting in Your promises. We thank You because we have the assurance that when we seek You wholeheartedly, we will find You. In Jesus’ name, Amen.<\/p>"}, {"n": 2, "title": "Lord, Search My Heart", "ref": "Psalm 139:23-24 (NLT)", "verse": "Search me, O God, and know my heart; Test me and know my anxious thoughts. Point out anything in me that offends you and lead me along the path of everlasting life.", "body": "<p>David, the Psalmist, had a deep love for God and was very expressive in his desire to worship and honour Him with his life. Psalm 139 gives us a beautiful and vulnerable glimpse into David’s heart. Throughout this Psalm, he acknowledges that God is all-knowing. He sees our hearts, knows our thoughts and is fully aware of our actions, even before we act. There is absolutely nothing we can hide from His presence.<\/p><p>However, what particularly stands out in verses 23 and 24 is David’s invitation to God: “Search me, O God.”<\/p><p>Of course, God already knows what is in our hearts, but David was willing to become completely vulnerable before Him. He was inviting God to dig deep, examine and expose every part of his being, including his fears, weaknesses, anxieties and hidden struggles. It was an invitation for God to perform spiritual surgery – to uncover anything that needed His attention. What a beautiful posture of humility and total surrender! One we should all desire to emulate.<\/p><p>Sometimes, as Christians, we can fall into the trap of performing rather than genuinely surrendering. We become so accustomed to routines and expectations that we can unintentionally mask the true condition of our hearts. But today’s scripture reminds us that God desires more than outward appearances. He wants access to our hearts. He wants us to invite Him into the places we may have kept hidden – our fears, anxieties, unforgiveness, unhealthy habits and blind spots that may be hindering our relationship with Him.<\/p><p><em>Are you willing to let God examine your heart, even the parts you would rather keep hidden? Can you surrender completely and allow Him to do a deep work within you?<\/em><\/p><p>David goes on to say, <em>“Point out anything in me that offends you and lead me along the path of everlasting life.”<\/em> This shows us that surrender is not simply about allowing God to reveal what is wrong; it is also about being willing to change. As God exposes the things that do not align with His will, we must be prepared to let go of them and allow Him to refine us. Whether it is sin, misplaced priorities, unhealthy attitudes or fears, we must be willing to surrender them to Him.<\/p><p>The beautiful thing about this process is that God does not expose these things to condemn us, but to restore, transform and lead us into His perfect will. As we yield to Him, He leads us along the path of everlasting life – a journey of spiritual growth, freedom and a deeper relationship with Him.<\/p><p>As we pray and fast today, let us give God permission to search the deepest parts of our hearts. Let us not be afraid of what He may reveal but be willing to surrender everything that is holding us back from experiencing a rich and flourishing relationship with Him.<\/p><p><em>Remember: God cannot transform the areas of our lives that we continually refuse to surrender to Him. Let today be a day of complete openness and surrender.<\/em><\/p>", "refl": "What prevents you from being completely vulnerable before God? Are there areas of your heart you have been reluctant to surrender? What would it mean to give God complete access today?", "reflText": "What prevents you from being completely vulnerable before God? Are there areas of your heart you have been reluctant to surrender? What would it mean to give God complete access today?", "prayer": "<p>Father God, we acknowledge that You are the all-knowing God who sees and knows all things. Today, we come before You in humility and total surrender. Search our hearts, examine our thoughts and reveal anything within us that does not align with Your will. Expose the areas we have hidden, the attitudes we need to change, the fears we need to overcome and the things we need to let go of. Give us the courage to surrender completely and allow You to refine us into the image of Your Son, Jesus Christ. Lead us along the path of everlasting life, and may our lives bring glory and honour to Your name. In Jesus’ name, Amen.<\/p>"}, {"n": 3, "title": "Holy Spirit, Help Me to Pray!", "ref": "Romans 8:26&27", "verse": "And the Holy Spirit helps us in our weakness, for example, we don’t know what God wants us to pray for. But the Holy Spirit prays for us with groanings that cannot be expressed in words. And the Father who knows all hearts know what the Spirit is saying, for the Spirit pleads for us believers in harmony with God’s will.", "body": "<p>Before His death and resurrection, Jesus assured His disciples that He would not leave them without help or comfort. <em>(John 16:7; John 14:26)<\/em> He promised that the Father would send the Holy Spirit, our Helper and Advocate, to be with us<em>. (John 14:16)<\/em> We see the fulfilment of this promise in Acts, when the Holy Spirit came upon the disciples, empowering and emboldening them to fulfil God’s purpose and spread the Good News of Jesus.<\/p><p>The Holy Spirit is our Helper, Teacher, Guide and Comforter. He does not simply work around us; He dwells within us, helping us in our human weaknesses and enabling us to live according to God’s will. One of the beautiful ways He helps us is through prayer.<\/p><p>Today’s scripture reminds us that <em>we do not always know what to pray for or how to pray as we ought.<\/em> Sometimes, we desire to pray but struggle to find the right words. At other times, the demands of life, emotional burdens and even the physical discomfort of fasting can leave us feeling weak and weary. But what an assurance we have! We are not left to figure it all out by ourselves. The Holy Spirit helps us in our weakness and intercedes for us with groanings that words cannot express.<\/p><p>Isn’t that wonderful? Even when we cannot put our deepest feelings into words, the Holy Spirit understands and intercedes for us in accordance with the will of God. He helps align our hearts and desires with the Father’s will, directing us beyond what we think we need towards what God knows is best for us.<\/p><p>This is why we must learn to depend on the Holy Spirit in our prayer lives. Prayer and fasting should not become a struggle we attempt to overcome solely through our own strength. We have a divine Helper living within us!<\/p><p>So, as you come into God’s presence today and throughout this week, invite the Holy Spirit to help you. When you feel too weak to pray, ask Him to strengthen you. When you are lost for words, ask Him to help you. When you do not know what to pray about, depend on Him to guide you. He knows the heart of the Father and helps us pray in alignment with His will.<\/p><p><em>You are not alone in the place of prayer. The Holy Spirit is your Helper! You do not have to rely on your own strength or find all the right words. Learn to depend on Him. Invite Him to help you pray today!<\/em><\/p>", "refl": "What would you like the Holy Spirit to help you with in your prayer life today? Have you been depending on your own strength, or have you been allowing Him to help you?", "reflText": "What would you like the Holy Spirit to help you with in your prayer life today? Have you been depending on your own strength, or have you been allowing Him to help you?", "prayer": "<p>Sweet Holy Spirit, we welcome Your presence today. Thank You for being our Helper, Teacher and Guide. Forgive us for the times we have tried to depend solely on our own strength. Teach us to pray, strengthen us in our weaknesses and help us to pray in accordance with the Father’s will. When we are lost for words, help us express our hearts before God. As we commit ourselves to prayer and fasting, align our hearts with the heart of the Father and empower us to fulfil His purpose. In Jesus’ name, Amen.<\/p>"}, {"n": 4, "title": "Empowered to Be His Witnesses", "ref": "Acts of the Apostles 1:8 (NLT)", "verse": "But you will receive power when the Holy Spirit comes upon you. And you will be my witnesses, telling people about me everywhere – in Jerusalem, throughout Judea, in Samaria, and to the ends of the Earth.", "body": "<p>Acts 1 gives us an account of the disciples during the days leading up to Jesus’ ascension. Before He was taken up into heaven (Acts 1:9), Jesus made a promise to His disciples: they would receive the Holy Spirit and be empowered to become His witnesses. He instructed them to wait in Jerusalem until this promise was fulfilled.<\/p><p>The disciples obeyed. They gathered together in prayer and waited, and on the day of Pentecost, the Holy Spirit came upon them (Acts 2). From that moment, their lives were never the same again! These ordinary men and women were empowered and emboldened to preach the Gospel, heal the sick, perform signs and wonders, and proclaim the message of Jesus Christ. The Gospel spread, the Church grew, and thousands came to believe in Jesus. What transformed these ordinary people into bold witnesses for Christ? <em>The power of the Holy Spirit!<\/em><\/p><p>This is the life we have also been called to live. We are not saved simply to enjoy the benefits of our salvation; we are called to share the good news of Jesus, build His Church, lead people to repentance and advance His Kingdom here on earth.<\/p><p>It is important to understand that the power Jesus promised in Acts 1:8 was not given simply for personal spiritual experiences or outward manifestations. Although the Holy Spirit works through signs, wonders and spiritual gifts, Jesus makes it clear that one of the primary purposes of this power is to enable us to be His witnesses. We are empowered to represent Christ and make Him known wherever He has placed us – in our workplaces, neighbourhoods, schools and communities.<\/p><p>Sometimes, we think sharing the Gospel is the responsibility of pastors, evangelists or those who have a special calling. But Jesus’ promise was to His disciples, and the call to witness belongs to every believer. We may not be eloquent speakers, particularly confident or have answers to every question people may ask. But we do not have to rely on our own abilities. The Holy Spirit gives us the boldness and confidence to share our faith. We can start by sharing our testimonies, our stories, speaking about what God has done in our lives and demonstrating the love of Christ through our everyday actions. Sometimes, our willingness to start a conversation, offer prayer, or invite someone to a Service or gathering can open the door for a life-changing encounter with Jesus.<\/p><p>As we draw closer to the end of the year, let us pause and reflect: <em>Are we still conscious that there are people in our world who desperately need to know Jesus? Are we sensitive to the Holy Spirit’s leading and willing to play our part in building His Church and making Jesus known?<\/em><\/p><p>We have not received the power of the Holy Spirit to remain silent; we have received power to be witnesses for Christ! Let us not keep the good news of salvation to ourselves. There are people around us who need to hear about Jesus, and God wants to use us to reach them.<\/p><p>As we pray and fast today, ask the Holy Spirit to give you fresh boldness, open doors of opportunity and direct you to the people whose hearts are open. You have been empowered. Now go and be His witness!<\/p>", "refl": "Who is the Holy Spirit prompting you to pray for, reach out to or invite to church or our Christmas services? What practical step can you take today to share Jesus with them?", "reflText": "Who is the Holy Spirit prompting you to pray for, reach out to or invite to church or our Christmas services? What practical step can you take today to share Jesus with them?", "prayer": "<p>Dear Heavenly Father, thank You for fulfilling Your promise by sending the Holy Spirit to dwell in us and empower us. Thank You that we do not have to fulfil the call to be Your witnesses in our own strength. Holy Spirit, give us fresh boldness and confidence to share our faith with those around us. Open our eyes to see the people You are leading us to reach and give us the wisdom and courage to share the message of salvation with them. May our words, actions and testimonies point people to Jesus. Let lives be transformed, souls be saved and Your Church continue to grow. May all the glory and honour return to You, now and forevermore. In Jesus’ name, Amen.<\/p>"}, {"n": 5, "title": "You Are Not Alone – God Is With You!", "ref": "Isaiah 43:2 (NLT)", "verse": "When you go through deep waters I will be with you. When you go through rivers of difficulty, you will not drown. When you walk through the fire of oppression, you will not be burned up; the flames will not consume you.", "body": "<p>The book of Isaiah was written during a difficult period in the history of the Israelites. They had experienced immense suffering, and the later chapters of Isaiah speak directly to their exile in Babylon. They had lost their homeland, their temple had been destroyed, and they were living in a foreign land under oppressive rule. In the midst of this pain and uncertainty, God’s words through Isaiah provided a beacon of hope, a promise of deliverance and the assurance that He had not abandoned His people.<\/p><p>In verse 1, God reminds the Israelites of their unique relationship with Him. He is not just any God; He is their Creator, Redeemer and the One who calls them by name. What a beautiful reminder of how personal and intentional God is about His people!<\/p><p>In verse 2, we see the use of water and fire as metaphors for the difficulties and trials we experience in life. This is a recurring theme throughout the Bible <em>(Psalm 23:4; Psalm 34:19; John 16:33)<\/em>. As long as we are on this earth, difficulties, trials and tribulations will be part of our journey. Being Christians or believers does not exempt us from trouble. In fact, sometimes, standing firm in our faith can bring its own challenges.<\/p><p>However, in the midst of all these difficulties, the Creator of heaven and earth assures us that <em>He will be with us!<\/em> I find this so reassuring. As we experience hardship, oppression, pain, grief and loss, we can hold on to the confidence that God is with us. We are not by ourselves. We are not alone, and we are not stranded. The Lord of Hosts walks with us through the deep waters and the fire until we get to the other side. His presence strengthens us, reminds us of who we are in Him and establishes our faith in Him.<\/p><p>We may sometimes ask, <em>“Why do we experience these trials when we have a God who is so mighty?”<\/em> Although we may not always understand why we go through certain difficulties, we can be confident that God remains faithful through them. Trials can become defining moments in our walk with God. They provide opportunities for us to experience His faithfulness, grow in our trust in Him and allow others to see His power at work in our lives. Sometimes, it is through our experiences that our own stories become a source of encouragement and strength to others. Our faith should be rooted in a deep conviction of who God is and what He is able to do, rather than simply in the circumstances surrounding us.<\/p><p><em>So, what are you going through today? What are the deep waters you are trying to navigate? What fire are you walking through?<\/em> Whatever it may be, remember that you are not alone. God’s presence is not dependent on how comfortable or difficult your circumstances are. He is with you in the middle of it all!<\/p><p>As you pray and fast today, declare this scripture over your life. Read it, speak it and meditate on it until its truth settles deeply in your heart. Let it strengthen your faith and remind you of God’s faithfulness. You are not alone! God is with you now and always!<\/p>", "refl": "Are you struggling to believe that God is fully aware of the difficulties you are experiencing and that He is truly with you? What would change if you became more conscious of His presence in the middle of your situation?", "reflText": "Are you struggling to believe that God is fully aware of the difficulties you are experiencing and that He is truly with you? What would change if you became more conscious of His presence in the middle of your situation?", "prayer": "<p>Dear Heavenly Father, thank You for the reassurance that You are always with us, even in the midst of hardship and difficult seasons. Thank You that we are never alone or stranded because Your presence goes with us. Continually remind us of Your promises, so that when the pressure of what we are going through becomes overwhelming, we will not lose sight of You. Strengthen our faith, help us to trust in Your unfailing love and give us the grace to stand firm, knowing that You are walking with us through every season. In Jesus’ name, Amen.<\/p>"}, {"n": 6, "title": "God’s Promises Are Yes and Amen!", "ref": "2 Corinthians 1:20-22 (NIV)", "verse": "For no matter how many promised God has made, they are “Yes” in Christ. And so, through him the “Amen” is spoken by us to the glory of God. Now it is God who makes both us and you stand firm in Christ. He anointed us, set his seal of ownership on us, and put His Spirit in our hearts as a deposit, guaranteeing what is to come.", "body": "<p>According to some biblical scholars, the number of promises in the Bible has been estimated to range from approximately <strong>3,573 to 8,810,<\/strong> depending on how they are counted and categorised. I find this fascinating and incredible!<\/p><p>Think about a wedding ceremony between a man and a woman. One of the most significant parts of the ceremony is the exchange of vows and promises. These vows represent their love, commitment and determination to remain faithful to one another throughout their lives. Yet, as we know, human beings are not always able to keep every promise they make. But God is different! <em>Unlike us, God never fails to keep His promises.<\/em> Verse 20 of our Scripture reminds us that no matter how numerous God’s promises are, they are all <em>“Yes” in Christ, and through Him we can confidently say, “Amen!”<\/em><\/p><p>This is a beautiful reminder of how much God loves us and how deeply He desires a relationship with us. His promises are not empty words or fragments of our imagination; they are rooted in His character and revealed through Jesus Christ. Through Christ, God has shown us the certainty of His love and the faithfulness of His Word. And as His promises are fulfilled in our lives, our response should be to give Him all the glory and share our experiences with others who are yet to know Him.<\/p><p><em>In verses 21 and 22<\/em>, Apostle Paul goes on to remind us that it is God who makes us stand firm in Christ. We cannot remain steadfast in our faith through our own strength, ability or performance. God has anointed us, placed His seal of ownership upon us and given us His Holy Spirit as a deposit, guaranteeing what is to come.<\/p><p>The presence of the Holy Spirit in our lives is a seal of ownership, reminding us of who we belong to and whose life we are called to reflect. He strengthens us in our faith, assures us of our identity in Christ and gives us a foretaste of the eternal life and joy that await us. Our strength, comfort and confidence must therefore come from our faith in God and our dependence on His Spirit.<\/p><p><em>Today, on Day 6 of our Prayer and Fasting, I want us to take a moment to reflect on the many promises of God.<\/em> Are there promises you once held on to but have gradually given up on because they have taken too long to be fulfilled? Are there promises you now struggle to believe because the situation seems impossible? Perhaps, deep down, you have begun to wonder whether God will really come through for you. Today, God is reminding us that no matter how many promises He has made, they are <em>“Yes” in Christ!<\/em> His Word has not changed, and His faithfulness has not diminished.<\/p><p>But there is another important response to God’s promises: <em>we must not keep the good news of His faithfulness to ourselves!<\/em> When we experience God’s love, grace and faithfulness, our lives should become a testimony that points others towards Him. As we approach our Christmas service, let us be intentional about inviting our family members, friends, neighbours and colleagues who may not yet know Christ. Christmas is a wonderful opportunity to share the greatest promise God has fulfilled for humanity: <em>the gift of His Son, Jesus Christ.<\/em><\/p>", "refl": "What promises of God have you struggled to believe because they seem to be taking too long? Can you bring them before Him again today and allow the Holy Spirit to strengthen your faith?", "reflText": "What promises of God have you struggled to believe because they seem to be taking too long? Can you bring them before Him again today and allow the Holy Spirit to strengthen your faith?", "prayer": "<p>Father God, who are we that You are so mindful of us? Thank You for Your unfailing love, Your faithfulness and the countless promises You have given us in Your Word. Thank You for the gift of Your Holy Spirit, the seal of Your ownership upon our lives and the guarantee of what is yet to come. Father, let Your Holy Spirit quicken our spirits and strengthen our faith to believe in Your promises, even when the waiting seems long. Help us not to grow weary or lose hope, but to trust in Your perfect timing. May the fulfilment of Your promises bring glory to Your name, and may our lives become testimonies of Your faithfulness. In Jesus’ mighty name, Amen.<\/p>"}, {"n": 7, "title": "He Is Able!", "ref": "Ephesians 3:20 (NKJV)", "verse": "Now to Him who is able to do exceedingly abundantly above all that we ask or think, according to the power that works in us.", "body": "<p>This is a very popular Scripture, well known across the Christian community. Apostle Paul was concluding his prayer for the believers in Ephesus when he burst into praise, declaring the extraordinary and limitless ability of God. <em>He reminds us that God is able to do exceedingly abundantly above all that we ask or think, according to His power at work within us.<\/em><\/p><p>When we look closely at this verse and read it in different bible translations, three important aspects of God’s character stand out.<\/p><ol type=\"1\">\n<li><p><em>“Now to Him who is able<\/em>” – An acknowledgement of God’s Sovereignty.<\/p><\/li>\n<\/ol><p>Paul begins by acknowledging that God is able. This speaks of His supreme authority, power and wisdom. God is not limited by our circumstances, our resources or our understanding. He has the power and authority to accomplish His purposes, even when we cannot see how it will happen.<\/p><p>Notice that Paul does not say God will do everything we ask; he declares that God is able. This is an important distinction because God’s ability is never in question, even when His answer or timing is different from what we expect. We can confidently bring our requests before Him, knowing that He is able to do what we cannot do for ourselves and that His wisdom is greater than ours.<\/p><ol start=\"2\" type=\"1\">\n<li><p><em>“To do exceedingly abundantly above all that we ask or think”<\/em> – An acknowledgement of God’s omnipotence (all-powerfulness/infinite power).<\/p><\/li>\n<\/ol><p>What a powerful statement! God’s ability goes far beyond the limits of our prayers and imagination. The things we ask are the requests we put into words; the things we think include the hopes, dreams and desires that sometimes remain in our hearts. Yet, even beyond these, God is able to do more than we could ever comprehend.<\/p><p>Sometimes, our circumstances are so challenging that we struggle to imagine a way forward. We may have dreams that seem too big, situations that appear impossible or prayers that we hardly know how to put into words. But none of these limitations restrict God’s power. Our minds are limited, but God is not! <em>We must never measure God’s ability by the limits of our own imagination.<\/em><\/p><ol start=\"3\" type=\"1\">\n<li><p><em>“According to the power that works in us”<\/em> – An acknowledgement of God’s Glory.<\/p><\/li>\n<\/ol><p>This is not simply power in the abstract; it is God’s power at work within us as believers. Earlier, in <em>verse 16<\/em>, Paul prayed that the believers would be strengthened with power through the Holy Spirit. Now, in <em>verse 20,<\/em> he reminds them that this same power is already at work within them. God’s power is not only demonstrated through what He does around us, but also through what He is doing within us. He strengthens our faith, transforms our hearts and enables us to live according to His purpose. And when God works in and through our lives, the glory belongs to Him. When the Lord does more than we could ask or imagine, He receives the glory.<\/p><p>As we come to the end of our seven days of Prayer and Fasting, I want to encourage you to dare to pray, dream and believe again! Do not allow your present circumstances to determine the size of your prayers or place limits on what you believe God can do. Perhaps there are things you have stopped praying about because they seem impossible. Perhaps there are dreams you have put aside because you cannot see how they could ever become a reality.<\/p><p>Today, let this Scripture remind you that we serve a God who is ABLE! He is not limited by what we can see, what we know or what we think is possible. However, as we pray and dream, let us also surrender our desires to His will, trusting that He knows what is best and that His plans are greater than ours.<\/p>", "refl": "How will your prayer life and the way you think about your circumstances change now that you have gained a deeper understanding of God’s character through Ephesians 3:20?", "reflText": "How will your prayer life and the way you think about your circumstances change now that you have gained a deeper understanding of God’s character through Ephesians 3:20?", "prayer": "<p>Dear Heavenly Father, we thank You because You are a limitless and all-powerful God. Thank You for reminding us of Your sovereignty and for giving us the confidence to know that You are able to do exceedingly abundantly above all that we ask or think, according to Your will and the power that works within us.<\/p><p>Father, give us eyes to see beyond our present circumstances and ears that are sensitive to Your voice. Help us to recognise the dreams, visions and purposes You are placing in our hearts, and give us the faith and courage to pursue them according to Your will. Take away every limiting mindset, fear and habit that prevents us from trusting You fully. Teach us to pray with boldness, believe with confidence and surrender with complete trust in Your wisdom and timing.<\/p><p>As we conclude these seven days of Prayer and Fasting, may our daily lives have renewed faith, deeper intimacy with You and a greater understanding of Your power at work within us. Remind us continually that we serve a God who is ABLE! In Jesus’ mighty name, Amen.<\/p>"}];
const START=null; // set to "2026-MM-DD" to open on the current day automatically
const $=s=>document.querySelector(s);
const st={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let cur=1;
function todayIdx(){if(!START)return null;const d=Math.floor((new Date().setHours(0,0,0,0)-new Date(START+'T00:00:00'))/864e5)+1;return d>=1&&d<=7?d:null}
function fromHash(){const m=/^#day-([1-7])$/.exec(location.hash);return m?+m[1]:null}
function nav(){const t=todayIdx();$('#days').innerHTML=DAYS.map(d=>`<button role="tab" data-n="${d.n}" aria-label="Day ${d.n}" aria-current="${d.n===cur}" class="${st.get('pf26:done:'+d.n)?'done':''} ${t===d.n?'today':''}">${d.n}</button>`).join('');
 const c=$('#days [aria-current="true"]');if(c)c.scrollIntoView({inline:'center',block:'nearest'})}
function show(n,push){cur=n;st.set('pf26:last',n);const d=DAYS[n-1],done=!!st.get('pf26:done:'+n),t=todayIdx();
 $('#day').innerHTML=`<p class="kick">Day ${d.n}${t===d.n?' · Today':''}</p><h2>${d.title}</h2>
 <div class="verse"><b>${d.ref}</b><p>${d.verse}</p></div>
 <div class="body">${d.body}</div>
 <section class="refl"><h3>Reflection</h3><p>${d.refl}</p></section>
 <section class="pray"><h3>Prayer</h3>${d.prayer}</section>
 <div class="row" style="margin-top:26px"><button class="btn ${done?'ok':''}" id="done" style="flex:1">${done?'✓ Day complete':'Mark day complete'}</button></div>
 <div class="pn"><button class="btn alt" id="prev" ${n===1?'disabled':''}>← Previous</button><button class="btn alt" id="next" ${n===7?'disabled':''}>Next →</button></div>`;
 $('#done').onclick=()=>{st.set('pf26:done:'+n,done?'':'1');show(n)};
 $('#prev').onclick=()=>go(n-1);$('#next').onclick=()=>go(n+1);
 nav();if(push)window.scrollTo({top:0});
 if(history.replaceState&&fromHash()!==n)history.replaceState(null,'','#day-'+n)}
function go(n){if(n>=1&&n<=7){show(n,true)}}
$('#days').onclick=e=>{const b=e.target.closest('button');if(b)go(+b.dataset.n)};
window.addEventListener('hashchange',()=>{const n=fromHash();if(n&&n!==cur)show(n,true)});
let fs=+st.get('pf26:fs')||18;const setFs=v=>{fs=Math.min(24,Math.max(15,v));document.documentElement.style.setProperty('--fs',fs+'px');st.set('pf26:fs',fs)};
document.getElementById('a-').onclick=()=>setFs(fs-1);document.getElementById('a+').onclick=()=>setFs(fs+1);setFs(fs);
show(fromHash()||todayIdx()||+st.get('pf26:last')||1,false);
</script></body></html>
